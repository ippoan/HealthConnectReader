name: Release APK
on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${VN}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Set versionCode
        run: sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Re-sign v1+v2
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" /tmp/u.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --min-sdk-version 28 \
            --ks app/release.keystore --ks-key-alias hcreader \
            --ks-pass "pass:${{ secrets.RELEASE_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out "$APK" /tmp/u.apk

      - name: Checksum
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}' \
            > app/build/outputs/apk/release/app-release.apk.sha256
          echo "APK_SHA256=$(cat app/build/outputs/apk/release/app-release.apk.sha256)" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true

      - name: Deploy to Pages
        run: |
          cp app/build/outputs/apk/release/app-release.apk /tmp/app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/app-release.apk app-release.apk
          git add app-release.apk
          git commit -m "Update APK ${{ steps.version.outputs.version }}"
          git push origin gh-pages
