name: Release APK
on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  # gh-pages push race を防ぐ。main は main 自身、PR は PR 番号ごとに直列化。
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # fork からの PR は keystore secret が無いので APK build/署名は skip。
    # 同 repo の PR は secret が見えるので dev-release が走る。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version + tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$EVENT" = "pull_request" ]; then
            # PR ごとの dev-release。tag は `dev-pr<N>-<run>` で `-` を含むので
            # GitHub の releases/latest に出ない (= 安定 consumer 影響無し)。
            TAG="dev-pr${PR_NUMBER}-${RUN_NUMBER}"
            PRERELEASE=true
          else
            TAG="v${VN}+${RUN_NUMBER}"
            PRERELEASE=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VN}" >> "$GITHUB_OUTPUT"

      - name: Compute Pages distribution URLs
        id: dist
        # alc-app 準拠で Pages を一次配信チャネルにする。QR target は
        # 安定 URL の github.io 側を指す (release asset の Azure 署名 URL は
        # mobile browser で詰まる事例があるため二次的なアーカイブ扱い)。
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PAGES_ROOT="https://${OWNER}.github.io/${REPO_NAME}"
          if [ "$EVENT" = "pull_request" ]; then
            REL_DIR="dev/pr${PR_NUMBER}"
          else
            REL_DIR=""
          fi
          if [ -n "$REL_DIR" ]; then
            APK_URL="${PAGES_ROOT}/${REL_DIR}/app-release.apk"
            QR_URL="${PAGES_ROOT}/${REL_DIR}/app-release-qr.png"
          else
            APK_URL="${PAGES_ROOT}/app-release.apk"
            QR_URL="${PAGES_ROOT}/app-release-qr.png"
          fi
          echo "rel_dir=${REL_DIR}" >> "$GITHUB_OUTPUT"
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "qr_url=${QR_URL}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.HCREADER_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Set versionCode
        run: sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts

      - name: Build release APK
        # PKCS12 keystore は store/key 同パスワードが仕様強制なので
        # `RELEASE_STORE_PASSWORD` 1 個を build.gradle.kts の両プロパティに
        # 流す (= secret は HCREADER_RELEASE_STORE_PASSWORD だけで運用)。
        # HCREADER_RELEASE_UPLOAD_TOKEN / _WORKER_URL は WebView + WorkManager
        # の BuildConfig に焼き込む値 (org-level secret + variable から注入、
        # Refs #6)。
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.HCREADER_RELEASE_STORE_PASSWORD }}
          HCREADER_RELEASE_UPLOAD_TOKEN: ${{ secrets.HCREADER_RELEASE_UPLOAD_TOKEN }}
          HCREADER_RELEASE_WORKER_URL: ${{ vars.HCREADER_RELEASE_WORKER_URL }}

      - name: Re-sign v1+v2
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" /tmp/u.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --min-sdk-version 28 \
            --ks app/release.keystore --ks-key-alias hcreader \
            --ks-pass "pass:${{ secrets.HCREADER_RELEASE_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.HCREADER_RELEASE_STORE_PASSWORD }}" \
            --out "$APK" /tmp/u.apk

      - name: Checksum
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}' \
            > app/build/outputs/apk/release/app-release.apk.sha256
          echo "APK_SHA256=$(cat app/build/outputs/apk/release/app-release.apk.sha256)" >> "$GITHUB_ENV"

      - name: Generate install QR
        env:
          QR_TARGET: ${{ steps.dist.outputs.apk_url }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode
          qrencode -o app/build/outputs/apk/release/app-release-qr.png -s 8 -m 2 "$QR_TARGET"

      - name: Compose release body
        env:
          APK_URL: ${{ steps.dist.outputs.apk_url }}
          QR_URL: ${{ steps.dist.outputs.qr_url }}
        run: |
          {
            echo ""
            echo "## インストール"
            echo ""
            echo "端末カメラで以下の QR を読み込むと \`app-release.apk\` の直 DL リンクが開く。"
            echo "「提供元不明のアプリ」を許可してインストール。"
            echo ""
            echo "<img src=\"${QR_URL}\" alt=\"Install QR\" width=\"260\">"
            echo ""
            echo "- APK 直 DL: ${APK_URL}"
            echo "- sha256: \`${APK_SHA256}\`"
            echo ""
            echo "(配信は GitHub Pages: ${APK_URL%/app-release.apk}/ 経由)"
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/app-release-qr.png
          generate_release_notes: true
          body_path: /tmp/release-body.md
          append_body: true

      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK_SHA256: ${{ env.APK_SHA256 }}
          APK_URL: ${{ steps.dist.outputs.apk_url }}
          QR_URL: ${{ steps.dist.outputs.qr_url }}
        with:
          script: |
            const tag = process.env.TAG;
            const sha = process.env.APK_SHA256;
            const apk = process.env.APK_URL;
            const qr  = process.env.QR_URL;
            const body = [
              `### Dev APK ready`,
              ``,
              `- Tag: \`${tag}\` (prerelease)`,
              `- APK: \`app-release.apk\` (sha256 \`${sha}\`)`,
              ``,
              `**端末カメラで QR を読むと APK 直 DL が始まる** (「提供元不明のアプリ」を許可してインストール):`,
              ``,
              `<img src="${qr}" alt="Install QR" width="260">`,
              ``,
              `または直リンク: ${apk}`,
              ``,
              `> 配信は GitHub Pages 経由 (\`${apk.replace(/\/app-release\.apk$/, '/')}\`)。Settings → Pages の source が \`gh-pages\` branch に enable されている前提。`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Deploy to Pages
        # alc-app 準拠の一次配信。main push は root に、PR は dev/pr<N>/ 下に置く。
        # gh-pages branch が無ければ orphan init する (= repo 立ち上げ初回の自動化)。
        # Pages 自体の有効化 (Settings → Pages → source: gh-pages branch / 「/」) は
        # 初回 1 回だけ user が手動で行う必要がある。
        env:
          REL_DIR: ${{ steps.dist.outputs.rel_dir }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # build artifact を一旦避難
          mkdir -p /tmp/dist
          cp app/build/outputs/apk/release/app-release.apk        /tmp/dist/
          cp app/build/outputs/apk/release/app-release.apk.sha256 /tmp/dist/
          cp app/build/outputs/apk/release/app-release-qr.png     /tmp/dist/

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
            git pull --ff-only origin gh-pages
          else
            echo "gh-pages not found, initializing as orphan"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
            cat > README.md <<'EOF'
          # HealthConnectReader APK distribution

          - Stable: `app-release.apk` (main の最新)
          - Dev PR builds: `dev/pr<N>/app-release.apk`

          QR PNG は同 dir に `app-release-qr.png` として配置。
          EOF
            git add README.md
            git commit -m "Init gh-pages"
          fi

          TARGET_DIR="${REL_DIR:-.}"
          mkdir -p "${TARGET_DIR}"
          cp /tmp/dist/app-release.apk        "${TARGET_DIR}/app-release.apk"
          cp /tmp/dist/app-release.apk.sha256 "${TARGET_DIR}/app-release.apk.sha256"
          cp /tmp/dist/app-release-qr.png     "${TARGET_DIR}/app-release-qr.png"
          git add "${TARGET_DIR}"
          git commit -m "Update APK ${TAG} (${TARGET_DIR})"

          # concurrent push race の軽い retry
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              exit 0
            fi
            echo "push failed, attempt ${attempt} — rebasing"
            git pull --rebase origin gh-pages || true
            sleep 2
          done
          echo "::error::Failed to push gh-pages after 3 attempts"
          exit 1

  auto-merge:
    # build (+ Pages deploy) が green になってから PR を auto-merge queue に
    # 入れる。ippoan/ci-workflows の reusable workflow を呼ぶ。
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    secrets:
      # TAG_RELEASE_PAT が無ければ github.token に fallback (auto-merge.yml の
      # 内部仕様)。fallback だと PR merge 後の `push: main` event が
      # github-actions[bot] 起因になり release.yml の main run が発火しない
      # 仕様 (downstream workflows are not triggered by GITHUB_TOKEN events)。
      # main 側の app-release.apk を確実に更新したい場合は org-level に
      # TAG_RELEASE_PAT を設定するか、merge 後に手動 workflow_dispatch する。
      TAG_RELEASE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
